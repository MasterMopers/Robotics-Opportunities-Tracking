name: Monitor robotics opportunities

on:
  # TODO: re-enable in Phase 8
  # schedule:
  #   # Off-the-hour minutes on purpose -- GitHub delays/drops scheduled runs
  #   # under load, and jobs at minute 0 get hit hardest. Do not "tidy" these.
  #   #
  #   # Phase 5 split: API-shaped sources (structured, cheap, no selector
  #   # rot -- devpost_api, markdown_list, bulk_xml, any json/json_embedded
  #   # source) run daily so a Devpost hackathon observed with only 4-8 days
  #   # left is never missed by a weekly window. HTML scrapers run weekly.
  #   # README rebuild stays monthly. sources.yaml's per-source `cadence`
  #   # key controls which sources monitor.py's --cadence flag selects.
  #   - cron: "37 13 * * *"   # daily: discovery run, --cadence daily
  #   - cron: "37 13 * * 1"   # weekly: discovery run, --cadence weekly (Monday)
  #   - cron: "37 13 1 * *"   # monthly: rebuild README from state.db
  workflow_dispatch:
    inputs:
      backfill:
        description: "Run monitor.py --backfill (re-check accepted items still missing location/participants; uses OPENAI_API_KEY if the secret is set)"
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Daily discovery run (API sources)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 13 * * *'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.backfill }}" = "true" ]; then
            python monitor.py --backfill
          else
            python monitor.py --cadence daily
          fi

      - name: Weekly discovery run (HTML scrapers)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 13 * * 1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python monitor.py --cadence weekly

      - name: Monthly README rebuild
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 13 1 * *'
        run: python render_readme.py

      - name: Commit state.db / README.md if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.db README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: automated update ($(date -u +%F))"
            git push
          fi
