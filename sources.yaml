# Discovery sources and the Watch calendar.
#
# Every extraction method below was verified against the live page/endpoint
# before being written here (see docs/PROBES.md for the Phase 0b/4 probe
# results). Nothing here is a guessed CSS selector.
#
# method values: rss | html | json | json_embedded | github | markdown_list
#                | devpost_api | bulk_xml
#
# `cadence: daily|weekly` (Phase 5) controls which of monitor.py's two
# scheduled runs a source is fetched on: API-shaped sources (structured,
# cheap, no selector rot) run daily; HTML scrapers run weekly. Absent =
# weekly, the old single-cadence default.

sources:
  - id: hackster
    name: "Hackster.io Contests"
    class: contest
    trust: high
    method: html
    url: "https://www.hackster.io/contests"
    min_expected: 1
    cadence: weekly
    parse:
      # Card CSS-module class names (contest_card__...__<hash>) are rebuilt
      # per deploy and are NOT stable. The stable anchor is the routing
      # pattern itself: every contest links to /contests/<slug>.
      link_href_prefix: "/contests/"
      exclude_href_contains: ["#", "/submissions"]
    notes: >
      Verified live: server-rendered HTML, 3 real contest slugs present
      (autodesk-university-2027-product, invent-the-future-with-arduino-uno-q-and-app-lab,
      modern-java-in-the-wild). Selector keys off href prefix, not hashed
      classnames. min_expected set to 1, not 3: Hackster's active-contest
      count is small and genuinely fluctuates, so 1 catches total selector
      breakage without false-alarming on a normal quiet week.

  - id: pcbway
    name: "PCBWay Sponsored Projects"
    class: contest
    trust: high
    method: html
    url: "https://www.pcbway.com/project/sponsor/"
    min_expected: 5
    cadence: weekly
    parse:
      item_container_class: "box-item"
      link_selector: "a.img-cover"
    notes: >
      Verified live: 16 div.box-item cards, each with a.img-cover -> project
      page, image alt text carries the project title.

  - id: devpost
    name: "Devpost Hackathons (server-side robotics search)"
    class: contest
    trust: high
    method: devpost_api
    url: "https://devpost.com/api/hackathons"
    min_expected: 3
    cadence: daily
    notes: >
      Phase 4b replacement (see adapters/devpost_api.py). Phase 0b
      re-probed this endpoint live and found the old WAF-403 note no
      longer reproduces: `search=`, `status[]=`, and `page=` all filter
      SERVER-SIDE now (docs/PROBES.md), so this adapter queries the API
      directly with a handful of robotics-ish search terms and
      status[]=open/upcoming instead of paginating the full ~14,000-item
      unfiltered set. Also maps submission_period_dates/displayed_location/
      registrations_count/prize_amount directly onto
      deadline_date/location/participants_count/money_raw (confidence
      "explicit") -- no regex, no LLM call, for the largest single source.
      Live-verified: 33 items across the current search-term set.

  - id: mlh
    name: "Major League Hacking Events"
    class: contest
    trust: high
    method: json_embedded
    url: "https://mlh.io/events"
    embedded_script_selector: 'script[data-page="app"]'
    json_path: "props.upcomingEvents"
    min_expected: 5
    cadence: daily
    notes: >
      Spec URL https://mlh.io/seasons returns HTTP 404 live; corrected to
      https://mlh.io/events (the current canonical listing, confirmed via
      the site's own nav links). The page embeds the full event list as
      JSON inside <script data-page="app">, so it is parsed directly --
      no DOM scraping, nothing to rot. Live check returned 70 events.

  - id: nayafia_microgrants
    name: "nayafia/microgrants (README, direct read)"
    class: grant
    trust: high
    method: markdown_list
    url: "https://raw.githubusercontent.com/nayafia/microgrants/master/README.md"
    min_expected: 30
    cadence: daily
    notes: >
      Phase 4a replacement for the old `github` commit-watcher, which hit
      the GitHub commits API and emitted commit messages -- routed to
      REVIEW unconditionally, yielding zero real grant listings from a
      file containing 39 of them. This adapter reads the file's actual
      content (see adapters/markdown_list.py): "## Program Name" headings,
      the block's first URL (bare or markdown-link form -- VitaDAO
      Fellowship uses the markdown form), and its "_italic_" description
      line as the snippet. Live-verified: 39 programs, 37 bare URLs, 1
      markdown link, 38 italic descriptions. min_expected: 30 (not 39) so
      the health check fails only on real breakage, not the list's own
      slow organic growth/shrinkage. Fixture committed at
      tests/fixtures/nayafia_microgrants.md for offline testing.

  - id: sologrants
    name: "Solo Grants -- The Grant Guide"
    class: grant
    trust: high
    method: html
    url: "https://sologrants.com/guide"
    min_expected: 10
    cadence: weekly
    parse:
      row_selector: "table tbody tr"
      name_selector: "span.font-semibold"
      link_selector: "a"
      amount_cell_index: 1
      eligibility_cell_index: 2
    notes: >
      Verified live: real HTML <table>, ~40 <tr> rows, each with
      <a href="/guide/<slug>"><span class="font-semibold">Name</span></a>
      followed by an amount-range cell and an eligibility cell.

  - id: awesomefoundation
    name: "Awesome Foundation Chapters"
    class: grant
    trust: high
    method: html
    url: "https://www.awesomefoundation.org/en/chapters"
    min_expected: 30
    cadence: weekly
    parse:
      item_selector: "article.country p a"
    notes: >
      Spec URL (bare homepage) does not list chapters; used the verified
      /en/chapters index instead (69 chapter links live, grouped under
      <article class="country">). Each chapter is modeled as one standing,
      rolling $1,000 microgrant -- that flat amount is Awesome Foundation's
      well-known, foundation-wide model, not something scraped per chapter.

  - id: hackaday
    name: "Hackaday (mixed feed)"
    class: both
    trust: low
    method: rss
    url: "https://hackaday.com/feed/"
    min_expected: 3
    cadence: weekly
    notes: "Verified live: standard RSS, 7 <item> entries on last fetch."

  - id: hn-robotics-grant
    name: "HN Algolia: robotics grant"
    class: both
    trust: low
    method: json
    url: "https://hn.algolia.com/api/v1/search_by_date?tags=story&query=robotics%20grant"
    json_items_path: "hits"
    min_expected: 1
    cadence: daily
    notes: "Verified live: public Algolia HN search API, 72 hits on last fetch."

  - id: hackaday_prize
    name: "Hackaday.io Contests"
    class: contest
    trust: high
    method: html
    url: "https://hackaday.io/contests"
    min_expected: 3
    cadence: weekly
    parse:
      # Distinct from the `hackaday` RSS source above, which is Hackaday's
      # editorial blog feed (posts, not contests) -- this is hackaday.io's
      # own contest-listing page, a different property. Same href-prefix
      # strategy as Hackster: every contest links to /contest/<id>-<slug>.
      link_href_prefix: "/contest/"
    notes: >
      Verified live: server-rendered HTML, 21 /contest/<id>-<slug> links on
      the default "Newest" sort (no query-param filter to open-only was
      found -- the sort dropdown's other options are all still "all
      contests", just reordered). This list includes past/closed contests
      as well as current ones; each contest's own page states its own
      deadline (extracted per-item, same as any other source), and
      monitor.py's expire_stale_items() flips a contest to "expired" once
      that deadline passes -- so stale entries here self-correct on the
      next run rather than needing a client-side open/closed filter.

  - id: instructables
    name: "Instructables Contests"
    disabled: true
    disabled_reason: >
      Probed live (2026-09-05): https://www.instructables.com/contest/ is a
      client-rendered React SPA (empty <div id="react-container">, a
      Vite/Rolldown JS bundle) with no server-rendered contest listing and
      no discovered public JSON endpoint (the page references a private
      Typesense search proxy with an embedded API key, not a stable public
      contract to build an adapter against; /json-api/contests,
      /sitemap.xml, and /feed all 404 or redirect to a login shell). The
      only real server-rendered signal found is two Twitter Card meta tags
      (twitter:label1/data1, twitter:label2/data2) naming the top two
      current contests and their deadlines, with no linkable URL -- not
      enough to build a reliable, non-guessed adapter against (a
      manufactured URL for a slug we didn't observe would violate the
      never-guess invariant). Left disabled per the spec's own contingency
      for exactly this situation (see challenge_gov below) rather than
      built against a guessed selector or private API contract.
    class: contest
    trust: high
    method: html
    min_expected: 0

  - id: challenge_gov
    name: "Challenge.gov"
    disabled: true
    disabled_reason: >
      Probed live (2026-09-05, docs/PROBES.md): challenge.gov is a
      client-rendered SPA shell with no challenge listing in the initial
      HTML and no discoverable JSON/XML feed (/api/challenges, /wp-json/,
      /feed/, /challenge/rss/ all 404). Matches the spec's own framing:
      "the only public documentation that exists is a dead 2011 XML feed
      and an abandoned third-party adapter." No current feed exists to
      build against.
    class: both
    trust: high
    method: html
    min_expected: 0

  - id: herox
    name: "HeroX Challenges"
    class: contest
    trust: high
    method: json
    url: "https://www.herox.com/async/api-internals/public/challenge/search"
    request_headers:
      Referer: "https://www.herox.com/crowdsourcing-projects"
      Accept: "application/json"
    json_items_path: "results"
    # HeroX's own `?q=` param on this endpoint was tested live and did NOT
    # change the result set (docs/PROBES.md) -- filtering is client-side
    # here, the same pattern the old (pre-probe) Devpost source used. Since
    # there's no server-side filter, paginate through `next` (bounded by
    # max_pages) rather than checking only the default first page's 10
    # items against the keyword list, which is almost always empty by
    # chance against 677 mostly-non-robotics challenges.
    paginate_next_field: "next"
    max_pages: 15
    filter_keywords_any:
      - robot
      - robotics
      - hardware
      - drone
      - uav
      - autonomous
      - sensor
      - prosthetic
      - satellite
      - engineering design
    min_expected: 0
    cadence: daily
    notes: >
      Phase 0b probe: the public listing page
      (https://www.herox.com/crowdsourcing-projects, not
      /crowdsourcing-challenges which 404s) embeds a
      <script id="page-data" type="application/json"> blob whose
      `view.api_url` names this internal search endpoint. Confirmed live:
      200, `{"count": 677, "next": "...?page=2", "results": [...]}` -- a
      real paginated JSON API (id/title/url/days_left/prize_short/promo/
      creator_title per item), not an HTML scrape. min_expected: 0 since
      this is an internal (undocumented) endpoint that could change
      without notice; a zero-item week is reported as quiet, not BROKEN.

  - id: grants_gov
    name: "Grants.gov (daily bulk XML export, robotics-filtered)"
    class: grant
    trust: low
    method: bulk_xml
    url: "https://www.grants.gov/xml-extract"
    min_expected: 0
    cadence: daily
    notes: >
      Phase 0b probe (docs/PROBES.md): the daily full-database export is
      discovered by re-fetching this page for the most recent dated
      GrantsDBExtract*.zip S3 link (confirmed live: ~74.5 MiB compressed,
      ~306 MiB uncompressed XML). adapters/bulk_xml.py streams the ZIP
      entry directly into ElementTree.iterparse (never materializing the
      full document) and keeps only records whose title/description
      mention a robotics-ish keyword AND whose CloseDate (if any) hasn't
      already passed -- the export is a full historical archive, not just
      open opportunities. Live-verified: ~32 current/rolling matches out
      of the full multi-decade archive. trust: low (this is a keyword
      filter over a huge, mostly-institutional archive, not a curated
      robotics source) -- goes through the normal contest/grant + relevance
      scoring gates like any other trust:low source. Expected low yield
      by design (most Grants.gov opportunities are institutional, not
      something a solo undergraduate can apply to directly), but the
      eligibility columns (lib/eligibility.py) do that filtering correctly
      and the download is cheap relative to what it is. min_expected: 0
      since a robotics-keyword hit rate this low can legitimately be zero
      on a given day without that meaning the source is broken.

