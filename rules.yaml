# All classification tuning lives here. Adding a phrase after a
# misclassification should be a one-line edit to this file, never to code.

thresholds:
  # Minimum score to be eligible for ACCEPT at all.
  floor: 2
  # Winning score must beat the runner-up by at least this much to ACCEPT
  # outright; anything closer goes to REVIEW.
  margin: 2
  # Minimum relevance score (see signals.relevance below) for an item to
  # pass the relevance gate in lib/classify.py, regardless of trust level.
  # THIS VALUE IS WRITTEN BY scripts/calibrate_floor.py -- do not hand-edit
  # it; re-run that script after changing data/calibration_labels.json or
  # any signals.relevance term list. See docs/PROBES.md for the sweep table
  # this value was selected from.
  relevance_floor: 4

# Phase 7: fit-score weights for ranking the unified "Act now" list
# (lib/rank.py). fit = relevance_weight*r_hat + eligibility_weight*e +
# money_weight*m_hat + deadline_weight*u -- see lib/rank.py's docstring for
# what each term means. Must sum to 1.0.
ranking:
  relevance_weight: 0.40
  eligibility_weight: 0.30
  money_weight: 0.15
  deadline_weight: 0.15

signals:
  # Broad-robotics relevance axis (Phase 2). A single `core` term qualifies
  # an item on its own; two non-core disciplines together also qualify
  # (that's what "any combination of mechanical/electrical/software" means)
  # -- one non-core discipline alone does not, which is what keeps a generic
  # AI/web hackathon out via the `software` bucket alone. See
  # lib/relevance.py for the scoring formula and lib/classify.py for how
  # this gates every trust level, including trust: high.
  relevance:
    core:
      - robot
      - robotic
      - robotics
      - manipulator
      - end effector
      - gripper
      - actuator
      - mechatronic
      - mechatronics
