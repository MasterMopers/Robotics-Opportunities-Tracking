# Phase 3: equity/incorporation/faculty-sponsor/team-size used to be hard
# REJECT rules here -- but "rejected outright" was always the wrong shape
# for these: they're eligibility facts about a specific operator profile
# (profile.yaml), not universal disqualifiers, and collapsing them into a
# reject meant losing the actual fact (e.g. "team of 4" rejected the row
# instead of recording max_team_size=4). They're migrated to structured
# extractors in eligibility_patterns below and lib/eligibility.py; the
# reject_rules entries for them are deleted here, not duplicated.
#
# K-12-only / high-school-only are migrated the same way, into max_age
# extractors (see eligibility_patterns.max_age below) instead of a reject,
# per the same reasoning.
#
# `institutional entry`/`company entry` stay here as hard REJECTs: this
# project's operator is a solo, unincorporated individual, and there is no
# eligibility column that would make "requires an institution/company as
# the entrant" anything other than a flat disqualifier -- unlike team size
# or incorporation, there's no profile value that ever satisfies it.
reject_rules:
  contest:
    - pattern: 'institutional entry'
      label: "institutional entry only"
    - pattern: 'company entry'
      label: "company entry only"
  grant:
    - pattern: 'business plan'
      label: "requires business plan"
    - pattern: 'pitch deck required'
      label: "requires pitch deck"
    - pattern: 'accelerator'
      label: "is an accelerator program"
    - pattern: 'cohort program'
      label: "is a cohort program"
    - pattern: 'demo day'
      label: "is a demo-day program"
    - pattern: 'tuition'
      label: "tuition-related"
    - pattern: 'scholarship for tuition'
      label: "tuition scholarship"

# Phase 3: structured eligibility extractors (lib/eligibility.py). Each
# produces one of the *_confidence values in {"explicit", "none"} (never a
# guess) -- confidence "llm" is added only by the Phase 6 LLM assessment
# fallback, for whatever these patterns leave unresolved. Negation-aware
# via the same _negated() window lib/enrich.py already uses (e.g. "no
# equity required" must not set equity_required=true).
eligibility_patterns:
  requires_incorporation:
    - 'incorporated'
    - 'C-corp'
    - 'LLC required'
  requires_faculty_sponsor:
    - 'faculty advisor'
    - 'faculty sponsor'
    - 'must be nominated by'
  requires_us_person:
    - 'U\.S\. citizen'
    - 'US citizens? only'
    - 'must be a (?:U\.S\.|US) (?:citizen|permanent resident)'
    - 'open only to (?:U\.S\.|US) residents'
  # An explicit statement that a US-person restriction does NOT apply --
  # only ever sets requires_us_person=false when the page itself says so,
  # never inferred from silence.
  requires_us_person_false:
    - 'open to (?:applicants |entrants )?worldwide'
    - 'open to international (?:applicants|entrants|teams)'
    - 'no citizenship (?:requirement|restriction)'
  equity_required:
    - 'equity'
    - 'SAFE note'
  requires_enrollment:
    - 'must be (?:a )?currently enrolled'
    - 'current(?:ly)? enrolled student'
    - 'enrolled full-time'
    - 'proof of enrollment'
  # K-12/high-school-only pages state an upper age bound implicitly rather
  # than a number -- 18 is the conventional US high-school-senior ceiling,
  # recorded explicitly as a real extracted fact (confidence "explicit"),
  # not a silent guess: the page's own "K-12"/"high school" wording is the
  # literal evidence for it.
  max_age:
    - pattern: 'grades? K-12'
      value: 18
    - pattern: 'high school students? only'
      value: 18
  # Free-text age bounds the page states outright.
  min_age_numeric:
    - 'must be (?:at least |)(\d{1,2}) (?:years? old|or older)'
    - 'ages? (\d{1,2})\+'
    - 'minimum age:?\s*(\d{1,2})'
  age_range_numeric:
    - 'ages? (\d{1,2})\s*(?:-|to|–)\s*(\d{1,2})'
  entry_fee_free:
    - 'no entry fee'
    - 'free to enter'
    - 'no application fee'
    - '\$0 (?:entry|application) fee'
  entry_fee_numeric:
    - 'entry fee(?: of)?:?\s*\$(\d[\d,]*(?:\.\d+)?)'
    - 'application fee:?\s*\$(\d[\d,]*(?:\.\d+)?)'
  max_team_size_numeric:
    - 'teams? of (?:up to )?(\d{1,2})'
    - 'up to (\d{1,2})[- ]person teams?'
    - 'maximum(?: team size)? of (\d{1,2})'
  max_team_size_solo:
    - '\bindividual entries only\b'
    - '\bsolo entries only\b'

# Deadline phrase patterns, tried in order. %DATE% is replaced with a
# dateutil-parseable date fragment matcher at runtime.
#
# The `(?:on\s+|is\s+|by\s+)?` tolerance below is a verified fix: HopHacks'
# real page text is "Applications close on September 1, 2026" -- the
# original `closes?\s+%DATE%` requires the date immediately after the verb,
# so the word "on" alone broke the match (confirmed live, 2026-09).
# The same tolerance is applied symmetrically to the other four patterns as
# a low-risk generalization (common English phrasing), not independently
# verified against a second real false-negative the way the "closes" fix
# was -- flagged here rather than overclaiming.
deadline_patterns:
  explicit:
    - 'deadline:?\s+(?:is\s+|on\s+)?%DATE%'
    - 'entries close\s+(?:on\s+)?%DATE%'
    - 'submissions? due\s+(?:on\s+|by\s+)?%DATE%'
    - 'closes?\s+(?:on\s+)?%DATE%'
    - 'ends?\s+(?:on\s+)?%DATE%'
  relative:
    - 'ends in (\d+)\s+days?'
    - 'closes in (\d+)\s+days?'
    - '(\d+)\s+days? (?:left|remaining)'

money_pattern: '(?:up to\s+)?\$\d{1,3}(?:,\d{3})*(?:\.\d+)?[kK]?(?:\s*(?:to|-|–)\s*\$?\d{1,3}(?:,\d{3})*(?:\.\d+)?[kK]?)?'

team_size_patterns:
  - 'team of\s+(\d+)'
  - 'up to\s+(\d+)\s+members?'
  - '(\d+)-person'
  - '\bindividual\b'
  - '\bsolo\b'

# Location/format extraction against the CLEAN TEXT view produced by
# lib/extract.py (doc.text) -- tags/attributes are already gone by the time
# these run, so no pattern here should assume raw markup. Tried in order;
# first match wins.
#
# As of Phase 1, JSON-LD location (Event.location.address, never an
# Organization block -- Hackster's contest pages carry Hackster's own HQ
# address in an Organization JSON-LD block with no Event block at all, a
# confirmed real false positive) and the MLH hero-location CSS-class marker
# are both handled as structured key lookups in lib/enrich.py against
# doc.structured, not as regexes here -- see lib/extract.py's
# _collect_location_hints and lib/enrich.py's _find_event_dicts.
location_city_patterns:
  - 'In-Person:\s*([^,.\n]{2,80})'
  - 'in person at\s+([^,."\n]{2,60}(?:,\s*[^,."\n]{2,40})?)'
  - 'held at\s+([^,."\n]{2,60})'
  - '\bVenue:\s*([^\n"]{2,60})'

location_format_phrases:
  in_person:
    - 'in-person event'
    - 'in-person only'
    - 'on-site'
    - 'must attend in person'
  remote:
    - 'fully remote'
    - 'remote-friendly'
    - 'virtual event'
    - 'held online'
    - 'online hackathon'
    - 'virtual hackathon'
    - 'apply from anywhere'
    - 'anywhere in the world'
    - '(?:eligib\w*|open to|apply)[^.\n]{0,60}\bworldwide\b'
  hybrid:
    - 'hybrid event'
    - 'in-person and virtual'
    - 'virtual and in-person'
    - 'in-person or virtual'

# Only ever a real number the page states (e.g. "9 participants", "141
# Participants"), never an invented estimate. Matched against the clean-text
# view (doc.text): a page like Hackster's "Participants" stat block used to
# be two adjacent <span> tags with the count right after the label
# (`Participants</span><span>141</span>`) -- lib/extract.py's clean-text
# pass now collapses that to plain "Participants 141", so the pattern below
# is text-shaped, not markup-shaped. Tried in order; first match wins.
participant_count_patterns:
  - 'Participants\s*\(\s*(\d[\d,]*)\s*\)'
  - 'Participants\s+(\d[\d,]*)\b'
  - '(\d[\d,]*)\+?\s*(?:participants|attendees|hackers|applicants|teams (?:competed|registered|applied))\b'

