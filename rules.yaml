      - 3D print
      - additive manufacturing
      - CNC
      - machining
      - laser cut
      - linkage
      - gearbox
      - compliant mechanism
      - FEA
      - tolerance stack
      - load cell
      - torque
    electrical:
      - PCB
      - KiCad
      - Altium
      - firmware
      - embedded
      - microcontroller
      - STM32
      - ESP32
      - Arduino
      - Raspberry Pi
